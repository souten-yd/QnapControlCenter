name: Validate Disk Inspector
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install icon build requirements
        run: python -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'Pillow==11.3.0'
      - name: Verify icon sizes
        run: |
          python scripts/render_icons.py --output /tmp/qcc-icons
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('/tmp/qcc-icons')
          for name,size in [('apple-touch-icon.png',180),('QnapControlCenter.png',64),('QnapControlCenter_80.png',80),('QnapControlCenter_gray.png',64)]:
              with Image.open(p/name) as im:
                  assert im.size == (size,size) and im.format == 'PNG'
          PY
      - name: Check dashboard JavaScript syntax
        run: node --check disk_inspector/app.js
      - name: AI diagnostic report formatter tests (browser-side, no NAS file writes)
        run: node --test tests/test_write_report.cjs
      - name: Python compilation
        run: python -m compileall -q disk_inspector tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Container Station low-I/O UI test syntax
        run: node --check disk_inspector/app.js
      - name: Safety grep
        run: |
          ! grep -R -nE 'subprocess|os\\.system|shell=True|eval\\(|exec\\(' --include='*.py' --exclude='installer.py' --exclude='container_lowio.py' --exclude='server.py' disk_inspector
          ! grep -nE 'shell=True|os\\.system|eval\\(|exec\\(' disk_inspector/server.py
          if [ -f disk_inspector/installer.py ]; then
            ! grep -nE 'shell=True|os\\.system|eval\\(|exec\\(' disk_inspector/installer.py
            grep -F 'subprocess.run([cli, "-m", str(target)]' disk_inspector/installer.py
            grep -F 'hmac.compare_digest' disk_inspector/installer.py
            grep -F 'sha256(body).hexdigest()' disk_inspector/installer.py
          fi
          grep -F 'container_lowio.apply(fingerprint)' disk_inspector/server.py
          grep -F 'authorized_post(' disk_inspector/server.py
          grep -F 'verified_backup(' disk_inspector/container_lowio.py
          ! grep -nE 'shell=True|os\.system|eval\(|exec\(' disk_inspector/container_lowio.py
