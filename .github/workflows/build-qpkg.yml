name: Build QPKG candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packaging/**'
      - 'disk_inspector/**'
      - 'assets/**'
      - 'scripts/render_icons.py'
      - '.github/workflows/build-qpkg.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install QDK 2.5.3
        run: |
          set -eu
          curl --fail --location --retry 3 -o /tmp/qdk.deb \
            https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/qdk.deb
      - name: Set up icon renderer
        run: |
          python3 -m venv /tmp/qcc-icon-venv
          /tmp/qcc-icon-venv/bin/python -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'Pillow==11.3.0'
          echo "/tmp/qcc-icon-venv/bin" >> "$GITHUB_PATH"
      - name: Build x86_64 QPKG
        run: sh packaging/build.sh
      - name: Verify actual QPKG payload and advertised diagnostics
        run: |
          set -eu
          for pkg in dist/*.qpkg; do
            python3 scripts/verify_qpkg_payload.py "$pkg"
          done
      - name: Check payload and checksums
        run: |
          set -eu
          test "$(find dist -name '*.qpkg' | wc -l)" -eq 1
          (cd dist && sha256sum *.qpkg > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qnapcontrolcenter-qpkg-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish QPKG pre-release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.14-rc16 >/dev/null 2>&1; then
            echo 'Release v0.1.14-rc16 already exists; skipping duplicate publication.'
          else
            gh release create v0.1.14-rc16 dist/*.qpkg dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title 'QnapControlCenter v0.1.14-rc16 (QTS unverified)' \
              --prerelease --notes 'QTS 5.x x86_64 candidate. Zero-setup LAN Web updating for official checksum-verified QPKGs: no user-entered token or IP allowlist; same-origin protections, one-use confirmation and safe installer remain. NAS validation pending. Back up before manual testing.'
          fi
